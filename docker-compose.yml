services:

  db:
    image: mysql:8.0
    container_name: lundinassets-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-lundinassets}
      MYSQL_USER: ${DB_USER:-lundin_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${DB_USER:-lundin_user}", "--password=${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: lundinassets-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${DB_NAME:-lundinassets};User=${DB_USER:-lundin_user};Password=${DB_PASSWORD:?set DB_PASSWORD in .env};AllowPublicKeyRetrieval=true;SslMode=none;"
      AdminUser__Email: ${ADMIN_EMAIL:-admin@lundinassets.se}
      AdminUser__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    volumes:
      - uploads:/app/wwwroot/uploads
    networks:
      - default
      - ontrack-net
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  uploads:

networks:
  ontrack-net:
    external: true
    name: ontrack_ontrack-net
