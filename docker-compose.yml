services:

  db:
    image: mysql:8.0
    container_name: lundinassets-db
    restart: unless-stopped
    # Every container on this host is capped. Unlimited containers are what let a
    # single docker build starve the box on 2026-08-14: the page cache collapsed
    # and the kernel spent 25 minutes re-reading the same blocks off disk, which
    # is what got the volume throttled. A cap turns that into one container being
    # killed instead of the whole machine stalling. Limits are ceilings, not
    # reservations — nothing is set aside while the container sits idle.
    # Sized against observed use: this instance holds well under 10 MB of data
    # and sits at ~385 MB resident, almost all of it fixed MySQL 8 overhead.
    mem_limit: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-lundinassets}
      MYSQL_USER: ${DB_USER:-lundin_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${DB_USER:-lundin_user}", "--password=${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Named "lundinassets", not "app": compose registers the service name as a DNS
  # alias on every network the service joins, so a generic name here would claim
  # "app" on the shared edge network and hijack it for every other stack whose
  # own containers resolve that name. Keep service names on edge-net unique.
  lundinassets:
    build: .
    container_name: lundinassets-app
    restart: unless-stopped
    mem_limit: 768m
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${DB_NAME:-lundinassets};User=${DB_USER:-lundin_user};Password=${DB_PASSWORD:?set DB_PASSWORD in .env};AllowPublicKeyRetrieval=true;SslMode=none;"
      AdminUser__Email: ${ADMIN_EMAIL:-admin@lundinassets.se}
      AdminUser__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    volumes:
      - uploads:/app/wwwroot/uploads
    networks:
      # default = this stack's private network, for reaching db.
      # edge-net = the shared proxy network, so edge-nginx can reach this app.
      - default
      - edge-net
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  uploads:

networks:
  # Created out-of-band (docker network create edge-net) and owned by no compose
  # project, so no stack's "down" can remove the network the others depend on.
  edge-net:
    external: true
    name: edge-net
